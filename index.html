        setState("connecting…");
        return dev.gatt.connect();
      })
      .then(function (g) { return g.getPrimaryService(SVC); })
      .then(function (svc) {
        return Promise.all([svc.getCharacteristic(CMD), svc.getCharacteristic(DATA), svc.getCharacteristic(AUTH)]);
      })
      .then(function (c) {
        cmdChar = c[0]; authChar = c[2];
        c[1].addEventListener("characteristicvaluechanged", onNotify);
        return c[1].startNotifications();
      })
      .then(function () {
        renderBar();
        log("connected to " + (dev.name || "device"));
        connectCbs.forEach(function (cb) { try { cb(); } catch (e) {} });
      })
      .catch(function (e) { cmdChar = null; renderBar(); if (e.name !== "NotFoundError") note("Connect failed: " + e.message); });
  }

  // ── GitHub scan database ───────────────────────────────────────────────────
  function gh() { return store.get("gh", { owner: "", repo: "", branch: "main", token: "" }); }

  function ghFetch(path, opts) {

  // scans/<serial>/<UTC scan time>.json - imports without a real time get undated-<dump hash>,
  // so re-importing the same backup maps to the same paths and is skipped.
  function buildRecord(scan, source, noteText) {

    Object.keys(scan).forEach(function (k) { if (k !== "fleet" && k !== "fs_scans" && k !== "auto_save") clean[k] = scan[k]; });
    if (!clean.serial_number) { var d = serialFromRaw(clean.raw_dump); clean.serial_number = d.sn; clean.serial_number_valid = d.ok; }
    var serial = clean.serial_number_valid && clean.serial_number ? clean.serial_number : "unknown-" + (scan.battery_id || "x");

    var scanned = scan.timestamp_epoch > 1e9 ? new Date(scan.timestamp_epoch * 1000).toISOString() : source === "import" ? null : uploaded;

  function b64utf8(s) {

  // The relay re-derives the ID and path itself and only takes these fields.
  function relayPut(rec) {

      method: "POST", headers: { "Content-Type": "application/json" },

      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok) return j;

      method: "PUT",
      body: JSON.stringify({
        message: "scan " + rec.path.split("/")[1] + " " + rec.body.uploaded_at,
        content: b64utf8(JSON.stringify(rec.body, null, 2) + "\n"),

  function queue() { return store.get("queue", []); }
  function flushQueue() {
    var q = queue();
    if (!q.length || !canUpload()) return Promise.resolve();
    log("uploading " + q.length + " pending…");
    function next() {
      q = queue();
      if (!q.length) { renderBar(); return; }
      return putRecord(q[0]).then(function () { log("uploaded " + q[0].path); }, function (e) {
        // 422 without a sha = file already exists -> uploaded earlier

    }
    return next().catch(function (e) { log("upload stopped: " + e.message); renderBar(); });
  }

  function uploadLast() {
    if (!lastScan) { note("Scan a pack first"); return; }
    if (!canUpload()) { document.getElementById("cpPanel").hidden = false; note("Fill in GitHub settings first"); return; }
    var n = window.prompt("Note for this scan (optional):", "");
    if (n === null) return;
    var rec = buildRecord(lastScan, "ble", n.trim());
    putRecord(rec).then(function (j) {
      if (j && j.review_url) { note("Sent - added after review"); log("sent for review " + j.review_url); }
      else { note("Uploaded to GitHub"); log("uploaded " + rec.path); }
    }, function (e) {
      if (/^duplicate/.test(e.message)) { note("Already in the database"); log("skipped (already in repo) " + rec.path); return; }

      note("Upload failed - queued"); log("upload failed (" + e.message + ") - queued");
    });
  }

  // CSV = the tool's /export (gwa_battery_scans.csv); otherwise JSON object/array or .jsonl.
  function parseScanCsv(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    var head = lines.shift().split(",");
    function num(v) { return v === "" || v == null ? null : Number(v); }
    return lines.map(function (l) {
      var c = {}; l.split(",").forEach(function (v, i) { c[head[i]] = v; });
      function cells(p) { return [1, 2, 3, 4, 5, 6, 7, 8].map(function (i) { return num(c[p + "_v" + i]); }); }
      return {
        battery_id: c.battery_id, identity_field: c.identity_field, serial_number: c.serial_number || undefined,
        stored_capacity: num(c.stored_cap), rated_capacity: num(c.rated_cap), capacity_pct: num(c.cap_pct), grade: c.grade,
        cal_cycles: num(c.cal_cycles), charge_events: num(c.charge_events), session_counter: num(c.session_counter),
        session_mah: num(c.session_mah), cal_measured: num(c.cal_measured),

      var q = queue().filter(function (r) { return !recs[r.path]; }).concat(Object.keys(recs).map(function (k) { return recs[k]; }));
      store.set("queue", q); renderBar();

    });
  }

  // ── bar + settings panel UI ────────────────────────────────────────────────
  function setState(t) { var s = document.getElementById("cpState"); if (s) s.textContent = t; }
  function renderBar() {

  }

  function buildUi() {
    var bar = document.createElement("div");

    bar.innerHTML =
      '<i class="cpDot"></i><span id="cpState">offline</span><span class="cpSp"></span>' +
      '<span id="cpQueue" class="cpQ"></span>' +
      '<button id="cpUpload" class="cpBtn" title="Upload the last scan to GitHub">⤒ GitHub</button>' +
      '<button id="cpConnect" class="cpBtn cpPri">Connect</button>' +
      '<button id="cpMenu" class="cpBtn" title="Settings">⋯</button>';
    var panel = document.createElement("div");
    panel.id = "cpPanel";
    panel.hidden = true;
    panel.innerHTML =
      '<p class="cpHint" id="cpSupport"></p>' +
      '<h3>GitHub scan database <span id="cpGh" class="cpQ"></span></h3>' +
      (RELAY_URL ? '<p class="cpHint">No token needed: without one, <b>⤒ GitHub</b> sends scans anonymously and they are added after review. The token below is only for the database owner.</p>' : '') +
      '<p class="cpHint">Fine-grained token, only the data repo, <b>Contents: Read and write</b>. Stored only in this browser.</p>' +
      '<label>Owner<input id="cpOwner" autocomplete="off"></label><label>Repository<input id="cpRepo" autocomplete="off"></label>' +
      '<label>Branch<input id="cpBranch" autocomplete="off"></label><label>Token<input id="cpToken" type="password" autocomplete="off"></label>' +
      '<div class="cpRow"><button id="cpSave" class="cpBtn cpPri">Save &amp; test</button><button id="cpFlush" class="cpBtn">Upload pending</button>' +
      '<button id="cpImport" class="cpBtn">Import file</button><input type="file" id="cpFile" accept=".json,.jsonl,.csv" hidden></div>' +
      '<h3>Bluetooth PIN</h3><p class="cpHint">Recode and restore only work over a PIN-paired link (asked for automatically). Pair now:</p>' +
      '<div class="cpRow"><button id="cpPair" class="cpBtn">Pair with PIN</button></div>' +
      '<h3>Log</h3><pre id="cpLog"></pre>';
    document.body.insertBefore(panel, document.body.firstChild);
    document.body.insertBefore(bar, document.body.firstChild);
    document.body.classList.add("cpHasBar");

    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    document.getElementById("cpSupport").textContent = navigator.bluetooth ? "" :
      ios ? "iPhone browsers (Safari, Chrome…) can't use Bluetooth - open this page in the free \"Bluefy\" app, or use the tool's WiFi page (192.168.4.1)."

    var c = gh();
    document.getElementById("cpOwner").value = c.owner; document.getElementById("cpRepo").value = c.repo;
    document.getElementById("cpBranch").value = c.branch || "main"; document.getElementById("cpToken").value = c.token;

    document.getElementById("cpConnect").onclick = connect;
    document.getElementById("cpUpload").onclick = uploadLast;
    document.getElementById("cpMenu").onclick = function () { panel.hidden = !panel.hidden; };
    document.getElementById("cpFlush").onclick = flushQueue;
    document.getElementById("cpImport").onclick = function () { document.getElementById("cpFile").click(); };
    document.getElementById("cpFile").onchange = function (e) { var f = e.target.files[0]; e.target.value = ""; if (f) importFile(f); };
    document.getElementById("cpPair").onclick = function () {
      if (!connected()) { note("Connect first"); return; }
      ensurePaired().catch(function (e) { note(e.message); });
    };
    document.getElementById("cpSave").onclick = function () {
      store.set("gh", {
        owner: document.getElementById("cpOwner").value.trim(), repo: document.getElementById("cpRepo").value.trim(),
        branch: document.getElementById("cpBranch").value.trim() || "main", token: document.getElementById("cpToken").value.trim(),
      });
      renderBar();
      ghFetch("").then(function (info) {
        log("GitHub ok: " + info.full_name + (info.permissions && info.permissions.push ? "" : " - WARNING: token can't push"));

      }, function (e) { log("GitHub test failed: " + e.message); });

  }

})();

  C:{label:"Fair",v:"--g-c",ink:"--g-c-ink"}, D:{label:"Worn",v:"--g-d",ink:"--g-d-ink"},
  E:{label:"Failing",v:"--g-e",ink:"--g-e-ink"}
};
var ICON = {
  scan:'<rect x="3" y="6" width="14" height="12" rx="2"/><path d="M20 9v6"/><path d="M3 12h14" stroke-dasharray="0.1 3.2"/>',

  live:'<path d="M2 12h4l2.5 7L13 5l2.5 7H22"/>',

function whR(u){return Math.round(u*UNITS_TO_WH);}

function chipId(sn,snv,idf){
  if(snv!==false&&sn&&sn!=="—")return String(sn);
  if(idf&&idf!=="—"&&idf!=="FF FF FF")return "ID-"+String(idf).replace(/ /g,"");

// ID/serial as shown on screen: hides the 'P' pad an odd-length serial is

/* ── SVG capacity gauge ── */
function gauge(pct,grade,size){

function cellBank(cells,base,range,label){
  var v=cells.filter(function(x){return x>0;}),mn=v.length?Math.min.apply(null,v):0,mx=v.length?Math.max.apply(null,v):0,sp=mx-mn;
  var q=sp<50?"ok":sp<100?"warn":"bad",qc=q==="ok"?"var(--g-a)":q==="warn"?"var(--g-c)":"var(--g-e)",bars="";
  for(var i=0;i<8;i++){var val=cells[i]||0,dead=!val,frac=dead?0:Math.max(.06,Math.min(1,(val-base)/range));
    var low=val>0&&val===mn&&sp>=50,col=dead?"var(--s3)":low?"var(--g-e)":qc;
    bars+='<div class="cell"><span class="cv" style="color:'+(dead?"var(--t3)":low?"var(--g-e)":"var(--t2)")+'">'+(dead?"—":val)+'</span>'
      +'<div class="track"><div class="fill" style="height:'+(frac*100)+'%;background:'+col+'"></div>'+(dead?'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--g-e)">'+svg("x",14)+'</div>':'')+'</div>'
      +'<span class="cl" style="color:'+(low?"var(--g-e)":"var(--t3)")+'">C'+(i+1)+'</span></div>';}
  return '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px">'
    +'<span class="eb">'+label+'</span><span class="chip '+q+'">'+sp+' mV spread</span></div><div class="bar">'+bars+'</div>';
}

/* ── register map tab ──
   What each part of the 256-byte AT24C02 holds, how sure we are, and (when a
   scan with a raw dump is loaded) what this battery has there. Mirrors
   docs/REGISTER_MAP.md - update both together.
   k = decode kind: byte | rec (LE16+XOR) | be (BE16+XOR) | hex | ascii | top | bot | dup4 | dup3 */
var MAP_CONF={confirmed:["Confirmed","--g-a"],likely:["Likely","--g-b"],hypo:["Hypothesis","--g-d"],unknown:["Unknown","--t3"]};
var MAP=[
 {s:"Status & identity"},
 {a:0x00,n:4,k:"byte",c:"hypo",t:"Status",d:"Status / self-test stage. Seen C0, 02, 01; the COP2 writes 10 at the start of self-test. Newer packs store it as [status FF XOR]. 0xE0 and up is treated as a fault state."},
 {a:0x04,n:4,k:"hex",c:"unknown",t:"Stage bytes",d:"Blank at rest on every pack, but the COP2 was caught writing small values to 0x01-0x02 during self-test."},
 {a:0x08,n:4,k:"rec",c:"unknown",t:"Unknown",d:"Read by the COP2 at every self-test. Blank on all packs so far."},
 {a:0x0C,n:4,k:"rec",c:"unknown",t:"Unknown",d:"Read by the COP2 at self-test. Only the R45 pack has a value here (12870)."},
 {a:0x18,n:4,k:"hex",c:"hypo",t:"Identity",d:"3 raw bytes. First byte 07 on every pack (model/family), last two differ per pack. Used as the battery ID when the serial can't be read."},
 {s:"Capacity & model"},
 {a:0x1C,n:4,k:"be",c:"confirmed",t:"Stored capacity",d:"Measured capacity in model units, big-endian. Divided by the rated code it gives the health %. Blank until the first calibration. Written by Recode."},
 {a:0x24,n:4,k:"rec",c:"confirmed",t:"Rated capacity (model code)",d:"500 = R37 family, 600 = R45 family. A tier code, not literal Wh or Ah."},
 {a:0x28,n:4,k:"be",c:"confirmed",t:"Model constant",d:"Big-endian. 13345 on R37 packs, 41000 on R45. Never changes."},
 {s:"Calibration (CAL)"},
 {a:0x2C,n:4,k:"rec",c:"confirmed",t:"Calibration count",d:"Number of full CAL cycles. Predicted, then confirmed: Bat:003 went 0 to 1 with its first CAL (5 Oct). Bat:001 is at 2."},
 {a:0x30,n:4,k:"rec",c:"confirmed",t:"Calibration measurement",d:"Capacity measured by the last CAL cycle, probably in mAh: Bat:003 (label 11.4 Ah) measured 12000. Written together with 0x34, 0x40/0x44, 0x74-0x7C and the cell tables."},
 {a:0x34,n:4,k:"rec",c:"likely",t:"Calibration mirror",d:"Copy of 0x30, written only by a real CAL cycle: blank on Bat:003 until its first CAL, then 12000 like 0x30."},
 {a:0x74,n:4,k:"rec",c:"hypo",t:"CAL stat 1",d:"Written at calibration. Two small bytes (23 to 27), maybe temperatures in degrees C during the CAL. Bat:003: 26/26, Bat:001: 27/25."},
 {a:0x78,n:4,k:"dup4",c:"likely",t:"Cell 9, top of charge",d:"One byte stored twice, +4000 mV like the top cell table. Bat:003's first CAL gave 4055 mV, right inside its other 8 cells (4053-4056), so very likely the 9th cell."},
 {a:0x7C,n:4,k:"dup3",c:"likely",t:"Cell 9, bottom of charge",d:"One byte stored twice, +3000 mV. Bat:003's first CAL gave 3162 mV, inside its other 8 cells (3162-3164). Pairs with 0x78."},
 {s:"Counters & gauge"},
 {a:0x10,n:4,k:"rec",c:"unknown",t:"Counter (meaning open)",d:"Not a simple charge counter: jumped 0 to 131 during Bat:003's first CAL cycle, but rose only +74 in 7 weeks on Bat:001. Reset to 0 by Recode."},
 {a:0x40,n:4,k:"rec",c:"hypo",t:"Charge gauge",d:"Moves down and up with use and resets to the 0x30 value when the pack is full."},
 {a:0x44,n:4,k:"rec",c:"hypo",t:"Gauge mirror",d:"Copy of 0x40. The COP2 writes 0x40, reads it back, then writes the same value here."},
 {a:0x50,n:4,k:"rec",c:"confirmed",t:"Session counter",d:"+1 every time the COP2 powers up with the pack attached (caught live). Reset to 0 by Recode."},
 {a:0x60,n:4,k:"rec",c:"hypo",t:"Slow counter",d:"Labelled cap_threshold in the tool, but it climbs slowly (356, 358, 365 on Bat:001) and a CAL cycle does not change it. Maybe a lifetime cycle count. Recode does not reset it."},
 {s:"Not yet understood"},
 {a:0x14,n:4,k:"rec",c:"unknown",t:"Unknown",d:"520 on Bat:003 and the R45 pack, blank on Bat:001."},
 {a:0x20,n:4,k:"rec",c:"unknown",t:"Unknown",d:"Read by the COP2 at self-test. Often two equal bytes: Bat:003 changed 0A FF to 0A 0A at its first CAL; R45 4A 4A."},
 {a:0x38,n:4,k:"rec",c:"unknown",t:"Flag",d:"0 or 1. Was 1 on Bat:001 before its first calibration, 0 since."},
 {a:0x3C,n:4,k:"rec",c:"unknown",t:"Unknown",d:"Read by the COP2 at self-test. 10300 on Bat:003, 12300 on R45, blank on Bat:001."},
 {a:0x48,n:4,k:"rec",c:"hypo",t:"Capacity ceiling?",d:"Read by the COP2 at self-test. 12000 on Bat:003, exactly what its first CAL measured, so maybe the design capacity that a CAL result is capped at. 12300 on R45 (its CAL: 11425)."},
 {a:0x4C,n:4,k:"rec",c:"unknown",t:"Unknown",d:"Read by the COP2 at self-test. 1000 on both newer packs."},
 {a:0x54,n:4,k:"hex",c:"unknown",t:"Unused?",d:"Blank on every pack so far and not read by the COP2."},
 {a:0x58,n:4,k:"rec",c:"unknown",t:"Unknown",d:"Read by the COP2 at self-test. Only the R45 pack has a value."},
 {a:0x5C,n:4,k:"rec",c:"unknown",t:"Unknown",d:"Read by the COP2 at self-test. Only the R45 pack has a value."},
 {a:0x64,n:16,k:"rec",c:"hypo",t:"Grade thresholds?",d:"Four rising values, read by the COP2. Bat:003 6000/7000/8000/9000, R45 7400/8400/9600/10700 = about 50/60/70/80 % of each pack's Ah, which matches the manual's CAP1-4 grade levels. Maybe the mAh a CAL result must reach for each CAP LED."},
 {s:"ID strings: battery, COP2, charger (2 ASCII chars per record)"},
 {a:0x80,n:32,k:"ascii",c:"confirmed",t:"Battery serial",d:"The serial printed on the pack label. Format (newer packs): B + BAP + T + period letter (M, N, O...) + 2-digit week? + 5-digit number. Odd-length serials get a P pad that is not on the label."},
 {a:0xA0,n:32,k:"ascii",c:"likely",t:"Last COP2 serial",d:"Serial of the COP2 adapter (the box between battery and charger) the pack was last charged through, rewritten at every COP2 power-on. COP2 serials look like PBAPDP2111804 - same format as the P... values found here. Bat:003 took the same value as Bat:001 after one charge through the same COP2."},
 {a:0xC0,n:32,k:"ascii",c:"hypo",t:"Original charger serial?",d:"Never read or written by the COP2, so set at the factory. Format C + BAPD + period letter + week? + number, and its period/week matches the battery (R45: TO46 battery, DO44 here), so probably the charger sold with the pack."},
 {s:"Cell voltages (written at calibration)"},
 {a:0xE0,n:16,k:"top",c:"likely",t:"Cells 1-8, top of charge",d:"One byte per cell, +4000 mV. Structure confirmed by XOR; which physical cell is which is still to be checked with a multimeter."},
 {a:0xF0,n:16,k:"bot",c:"likely",t:"Cells 1-8, bottom of charge",d:"One byte per cell, +3000 mV."}
];
function h2(n){return ("0"+n.toString(16).toUpperCase()).slice(-2);}
function mapBytes(raw){if(!raw||raw.length<512)return null;var a=[];for(var i=0;i<256;i++)a.push(parseInt(raw.substr(i*2,2),16));return a;}
function recState(B,o){var lo=B[o],hi=B[o+1],x=B[o+2];if(lo===255&&hi===255&&x===255)return "blank";return (lo^hi)===x?"ok":"bad";}
// Decoded value of one map entry for this dump: {v, q} with q = ok | blank | bad
function mapValue(e,B){
  var i,o,q,out=[],qs=[];
  if(e.k==="byte")return {v:"0x"+h2(B[e.a]),q:"ok"};
  if(e.k==="hex"){var hx=[];for(i=0;i<3;i++)hx.push(h2(B[e.a+i]));return {v:hx.join(" "),q:hx.join("")==="FFFFFF"?"blank":"ok"};}
  if(e.k==="ascii"){
    var s="";q="ok";
    for(o=e.a;o<e.a+e.n;o+=4){var st=recState(B,o);if(st!=="ok"){q=s?"ok":st;break;}if(B[o]===0x50&&B[o+1]===0x50)break;s+=String.fromCharCode(B[o],B[o+1]);}
    return {v:s?showId(s):"—",q:s?"ok":q};
  }
  if(e.k==="top"||e.k==="bot"){
    var base=e.k==="top"?4000:3000,c=[];
    for(o=e.a;o<e.a+e.n;o+=4){qs.push(recState(B,o));for(i=0;i<2;i++)if(B[o+i]!==255)c.push(base+B[o+i]);}
    if(!c.length)return {v:"—",q:"blank"};
    return {v:c.join(" ")+"  ("+(Math.max.apply(null,c)-Math.min.apply(null,c))+" mV spread)",q:qs.indexOf("bad")>=0?"bad":"ok"};
  }
  if(e.k==="dup4"||e.k==="dup3"){
    q=recState(B,e.a);if(q!=="ok")return {v:"—",q:q};
    return B[e.a]===B[e.a+1]?{v:((e.k==="dup4"?4000:3000)+B[e.a])+" mV",q:"ok"}:{v:"0x"+h2(B[e.a])+h2(B[e.a+1]),q:"ok"};
  }
  for(o=e.a;o<e.a+e.n;o+=4){
    q=recState(B,o);qs.push(q);
    out.push(q==="ok"?String(e.k==="be"?(B[o]<<8|B[o+1]):(B[o+1]<<8|B[o])):"—");
  }
  return {v:out.join(" / "),q:qs.indexOf("bad")>=0?"bad":qs.indexOf("ok")>=0?"ok":"blank"};
}
function mapRaw(e,B){var r=[];for(var o=e.a;o<e.a+Math.min(e.n,8);o+=4)r.push(h2(B[o])+" "+h2(B[o+1])+" "+h2(B[o+2]));return r.join(" · ")+(e.n>8?" …":"");}
function mapJump(a){var el=$("m-"+h2(a));if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(function(){el.classList.remove("flash");},1200);}}
function viewMap(){
  var b=state.current,B=b?mapBytes(b.raw):null,cover=[],i,e;
  for(i=0;i<MAP.length;i++){e=MAP[i];if(e.s)continue;for(var r=e.a;r<e.a+e.n;r+=4)cover[r>>2]=e;}
  var s='<div class="stack">';
  s+='<div class="card"><div class="ch"><span class="t">EEPROM register map</span></div>'
    +'<p class="hint">The battery stores its data in a 256-byte AT24C02 EEPROM at I2C address 0x50, as 64 records of 4 bytes. '
    +'Most records are a 16-bit number + XOR check + FF padding. Tap a square to jump to its field.</p>'
    +'<div class="mlegend">'+Object.keys(MAP_CONF).map(function(k){return '<span><i style="background:var('+MAP_CONF[k][1]+')"></i>'+MAP_CONF[k][0]+'</span>';}).join("")+'</div>'
    +(B?'<p class="hint" style="margin-top:8px">Values below are from <b style="color:var(--text)">'+showId(effId(b))+'</b>. Faded squares are blank (FF) on this battery.</p>'
       :'<p class="hint" style="margin-top:8px">Scan a battery or analyse a dump to see its values here.</p>')
    +'<div class="mgrid">';
  for(var row=0;row<8;row++){
    s+='<span class="mrow">'+h2(row*32)+'</span>';
    for(var col=0;col<8;col++){
      var idx=row*8+col,a=idx*4;e=cover[idx];
      var col_=e?MAP_CONF[e.c][1]:"--t3",blank=B&&recState(B,a)==="blank"&&B[a+3]===255;
      s+='<button class="mcell'+(blank?" mblank":"")+'" style="--mc:var('+col_+')" title="0x'+h2(a)+(e?" "+e.t:"")+'" onclick="mapJump('+(e?e.a:a)+')">'+h2(a)+'</button>';
    }
  }
  s+='</div></div>';
  var open=false;
  for(i=0;i<MAP.length;i++){
    e=MAP[i];
    if(e.s){s+=(open?'</div>':'')+'<div class="card"><div class="ch"><span class="t">'+e.s+'</span></div>';open=true;continue;}
    var cf=MAP_CONF[e.c],val=B?mapValue(e,B):null;
    var rng="0x"+h2(e.a)+(e.n>4?"–"+h2(e.a+e.n-1):"");
    s+='<div class="mitem" id="m-'+h2(e.a)+'">'
      +'<div class="mhead"><span class="maddr">'+rng+'</span><span class="mt">'+e.t+'</span>'
      +'<span class="chip" style="color:var('+cf[1]+');border-color:color-mix(in oklab,var('+cf[1]+') 40%,transparent)">'+cf[0]+'</span></div>'
      +'<p class="hint">'+e.d+'</p>';
    if(val){
      var qc=val.q==="bad"?"var(--g-e)":val.q==="blank"?"var(--t3)":"var(--text)";
      s+='<div class="mval"><span class="num" style="color:'+qc+'">'+(val.q==="blank"?"blank (never written)":val.q==="bad"?"XOR check failed":val.v)+'</span>'
        +'<span class="mono muted">'+mapRaw(e,B)+'</span></div>';
    }
    s+='</div>';
  }
  if(open)s+='</div>';
  return s+'</div>';
}

function fleetBar(pct,color){
  var w=Math.round(Math.max(2,Math.min(100,pct)));
  return '<div style="flex:1;height:6px;background:var(--s3);border-radius:3px;overflow:hidden;position:relative">'
    +'<div style="position:absolute;left:0;top:0;height:100%;width:'+w+'%;background:'+color+';border-radius:3px;transition:width .4s"></div>'
    +'<div style="position:absolute;left:calc(50% - .5px);top:0;height:100%;width:1px;background:var(--line2);opacity:.5"></div>'
    +'</div>';
}
function fleetCard(b){
  var fl=b.fleet;
  if(!fl) return '';
  // rows: [label, fieldKey, unit, lowerIsBetter]
  var rows=[
    ['Capacity',      'cap_pct',       '%',   false],
    ['CAL cycles',    'cal_cycles',    '',    false],
    ['Charge events', 'charge_events', '',    false],
    ['Cell spread T', 'top_spread',    ' mV', true],
    ['Cell spread B', 'bot_spread',    ' mV', true],
  ];
  var s='<div class="card"><div class="ch"><span class="t">Fleet comparison</span>'
    +'<span class="sp"></span><span class="eb">'+fl.n+' batteries</span></div>';
  s+='<div style="display:flex;flex-direction:column;gap:10px">';
  rows.forEach(function(r){
    var key=r[1],unit=r[2],low=r[3];
    var fd=fl[key]; if(!fd) return;
    var v=num(fd.v),mn=num(fd.min),mx=num(fd.max),mean=num(fd.mean),pctRank=num(fd.pct);
    // For lower-is-better fields invert the bar so red is right
    var barPct=low?(100-pctRank):pctRank;
    var isOutlier=low?(v>mean*1.5&&v>50):(v<mean*0.7);
    var color=isOutlier?'var(--g-e)':pctRank>66?'var(--g-a)':pctRank>33?'var(--g-c)':'var(--g-e)';
    if(low) color=isOutlier?'var(--g-e)':pctRank<33?'var(--g-a)':pctRank<66?'var(--g-c)':'var(--g-e)';
    s+='<div>'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">'
      +'<span style="font-size:12px;color:var(--t2)">'+r[0]+'</span>'
      +'<span style="font-family:var(--mono);font-size:13px;font-weight:600;color:'+(isOutlier?'var(--g-e)':'var(--text)')+'">'+v+unit
      +(isOutlier?' <span style="font-size:10px;color:var(--g-e)">outlier</span>':'')+'</span></div>'
      +fleetBar(barPct,color)
      +'<div style="display:flex;justify-content:space-between;margin-top:3px">'
      +'<span style="font-size:10px;color:var(--t3);font-family:var(--mono)">'+mn+unit+'</span>'
      +'<span style="font-size:10px;color:var(--t3);font-family:var(--mono)">avg '+Math.round(mean)+unit+'</span>'
      +'<span style="font-size:10px;color:var(--t3);font-family:var(--mono)">'+mx+unit+'</span>'
      +'</div></div>';
  });
  s+='</div></div>';
  return s;
}

// Effective identifier for a raw snapshot-log record — same chipId() rule,
// so snapshots group under the same identifier shown in the UI.
function snapEffectiveId(s){
  return chipId(s.serial_number,s.serial_number_valid,s.identity_field);
}
function trendCard(b){
  var bid=effId(b);
  var pts=state.snaps.filter(function(s){return snapEffectiveId(s)===bid;})
    .map(function(s){return {p:num(s.capacity_pct),t:num(s.timestamp_epoch)};}).sort(function(a,c){return a.t-c.t;});
  pts.push({p:b.pct,t:9e9});
  if(pts.length<2) return '<div class="card"><div class="ch"><span class="t">Capacity trend</span></div><div class="hint">Save snapshots over time to chart this battery\u2019s capacity loss.</div></div>';
  var w=360,h=130,pl=26,pr=12,pt=12,pb=14,min=40,max=100,c=gv(b.grade);
  function X(i){return pl+(w-pl-pr)*i/(pts.length-1);}
  function Y(p){return pt+(h-pt-pb)*(1-(Math.max(min,Math.min(max,p))-min)/(max-min));}
  var poly=pts.map(function(o,i){return X(i)+","+Y(o.p);}).join(" ");
  var area=X(0)+","+(h-pb)+" "+poly+" "+X(pts.length-1)+","+(h-pb);
  var grid="";[50,60,70,80].forEach(function(g){grid+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(w-pr)+'" y2="'+Y(g)+'" stroke="var(--line)" stroke-width=".7" stroke-dasharray="2 3"/>';});
  return '<div class="card"><div class="ch"><span class="t">Capacity trend</span><span class="sp"></span><span class="eb">'+pts.length+' pts</span></div>'
    +'<svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block">'+grid
    +'<polygon points="'+area+'" fill="'+c+'" opacity=".16"/>'
    +'<polyline points="'+poly+'" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round"/>'
    +'<circle cx="'+X(pts.length-1)+'" cy="'+Y(b.pct)+'" r="4" fill="'+c+'" stroke="var(--surface)" stroke-width="2"/></svg></div>';
}

/* ── Live tab: continuous /scan polling, client-side chart + log table ── */
function liveChart(points){
  if(points.length<2) return '<div class="hint">Waiting for at least 2 readings to plot a trend…</div>';
  var w=360,h=140,pl=30,pr=12,pt=14,pb=16;
  var vals=points.map(function(p){return p.pct;});
  var min=Math.max(0,Math.min.apply(null,vals)-5),max=Math.min(100,Math.max.apply(null,vals)+5);
  if(max-min<10){min=Math.max(0,min-5);max=Math.min(100,max+5);}
  function X(i){return pl+(w-pl-pr)*i/(points.length-1);}
  function Y(p){return pt+(h-pt-pb)*(1-(Math.max(min,Math.min(max,p))-min)/(max-min));}
  var poly=points.map(function(o,i){return X(i)+","+Y(o.pct);}).join(" ");
  var area=X(0)+","+(h-pb)+" "+poly+" "+X(points.length-1)+","+(h-pb);
  var last=points[points.length-1],c=gv(last.grade);
  var grid="";[0,25,50,75,100].filter(function(g){return g>=min&&g<=max;}).forEach(function(g){
    grid+='<line x1="'+pl+'" y1="'+Y(g)+'" x2="'+(w-pr)+'" y2="'+Y(g)+'" stroke="var(--line)" stroke-width=".7" stroke-dasharray="2 3"/>'
      +'<text x="'+(pl-6)+'" y="'+(Y(g)+3)+'" text-anchor="end" font-size="9" fill="var(--t3)" font-family="var(--mono)">'+g+'</text>';});
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block">'+grid
    +'<polygon points="'+area+'" fill="'+c+'" opacity=".14"/>'
    +'<polyline points="'+poly+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/>'
    +'<circle cx="'+X(points.length-1)+'" cy="'+Y(last.pct)+'" r="3.5" fill="'+c+'" stroke="var(--surface)" stroke-width="2"/></svg>';
}

function setLiveInterval(v){state.live.intervalMs=parseInt(v,10)||5000;}
function pollLiveOnce(){
  return getJSON("/scan").then(function(j){
    if(j&&j.eeprom_found===false){state.live.errCount++;state.live.lastErr="no EEPROM found";if(state.tab==="live")render();return;}
    var b=normalize(j);
    state.current=b;
    var d=new Date();
    state.live.points.push({
      t:d.toTimeString().slice(0,8), pct:b.pct, grade:b.grade, status:b.status,
      sessionMah:b.sessionMah, sessionCounter:b.sessionCounter, ec2Risk:b.ec2Risk
    });
    if(state.live.points.length>LIVE_MAX_POINTS) state.live.points.shift();
    if(state.tab==="live") render();
  }).catch(function(e){state.live.errCount++;state.live.lastErr="request failed";if(state.tab==="live")render();});
}
function startLive(){
  if(state.live.running) return;
  state.live.running=true;
  pollLiveOnce();
  state.live.timer=setInterval(pollLiveOnce,state.live.intervalMs);
  render();
}
function stopLive(){
  state.live.running=false;
  if(state.live.timer){clearInterval(state.live.timer);state.live.timer=null;}
  render();
}
function clearLive(){state.live.points=[];state.live.errCount=0;state.live.lastErr=null;render();}

  s+='</div>';return s;
}
function spreadVal(mv){var q=mv<50?"ok":mv<100?"warn":"bad",c=q==="ok"?"var(--g-a)":q==="warn"?"var(--g-c)":"var(--g-e)";
  return '<span style="color:'+c+'">'+mv+' mV '+(mv<50?"✓":mv<100?"~":"✗")+'</span>';}
function hexb(n){return "0x"+(n||0).toString(16).toUpperCase().padStart(2,"0");}

function viewHistory(){
  var s='<div class="stack">';
  /* compare panel */
  if(state.cmp){s+=comparePanel(state.cmp.a,state.cmp.b);}
  else {s+='<div class="card" style="display:flex;gap:10px;align-items:center;background:var(--s2)"><span style="color:var(--t3)">'+svg("history",18)+'</span>'
    +'<div class="hint">Open a battery and use Store A / Store B (on the Scan tab) to compare two packs here.</div></div>';}
  /* fleet list — grouped by effective identifier (chip serial when valid, else battery ID) */
  var seen={},list=[];
  for(var i=state.recent.length-1;i>=0;i--){var b=state.recent[i],k=effId(b);if(!seen[k]){seen[k]=1;list.unshift(b);}}
  s+='<div class="ch" style="margin-top:4px;margin-bottom:0"><span class="t">Scanned batteries</span><span class="sp"></span><span class="eb">'+list.length+' logged</span></div>';
  if(!list.length){s+='<div class="card empty">'+svg("history",30)+'<div class="et">No history yet</div><div class="hint" style="margin-top:6px">Scan a few batteries to build a log.</div></div>';}
  else { s+=list.map(function(b){
    var bk=balKind(b),d=displayId(b);
    return '<button class="drill" onclick="openId(\''+effId(b)+'\')">'+gradeSq(b.grade,40)
      +'<div class="tx"><div class="t">'+d.primary+(d.secondary?' <span style="color:var(--t3);font-weight:500;font-size:12px">('+d.secondary+')</span>':'')+' <span style="color:var(--t3);font-weight:500;font-size:13px">'+b.model+'</span></div>'
      +'<div class="d">'+fmtPct(b.pct)+'% · '+b.calCycles+' cyc · '+(bk==="bad"?"cell fault":bk==="warn"?"spread "+Math.max(b.topSpread,b.botSpread)+"mV":"balanced")+'</div></div>'
      +'<span style="color:var(--t3)">'+svg("chev",18)+'</span></button>';
  }).join(""); }
  /* snapshot log */
  if(state.snaps.length){
    s+='<div class="ch" style="margin-top:6px;margin-bottom:0"><span class="t">Snapshot log</span><span class="sp"></span><span class="eb">'+state.snaps.length+' saved</span></div>';
    s+='<div class="card" style="padding:6px 0">'+state.snaps.slice(0,12).map(function(o){
      var g=o.grade||"?",c=gv(g);
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)">'
        +'<span class="num" style="color:var(--t3);font-size:11px;width:96px">'+(o.timestamp||"").slice(0,16)+'</span>'
        +'<span style="font-weight:700;color:var(--text);font-size:13px">'+(showId(snapEffectiveId(o))||"?")+'</span>'
        +'<span style="color:'+c+';font-weight:800">'+g+'</span><span class="sp"></span>'
        +'<span class="num" style="color:var(--t2);font-size:12px">'+(o.stored_wh||"?")+' Wh · '+fmtPct(num(o.capacity_pct))+'%</span></div>';
    }).join("")+'</div>';
  }
  s+='</div>';return s;
}
function comparePanel(a,b){
  var fields=[["grade","Grade",0,""],["cap_pct","Capacity",1,"%"],["stored_cap","Stored",1,""],["cal_cycles","CAL cycles",1,""],
    ["cal_measured","CAL measured",1,""],["charge_events","Charge events",1,""],["session_counter","Sessions",1,""],
    ["top_spread","Top spread",1," mV"],["bot_spread","Bottom spread",1," mV"],["xor_errors","XOR errors",1,""]];
  var ca=gv(a.grade),cb=gv(b.grade);
  var rows=fields.map(function(f){
    var va=a[f[0]],vb=b[f[0]],changed=String(va)!==String(vb),delta="—";
    if(changed&&f[2]){var d=parseFloat(vb)-parseFloat(va);delta=(d>0?"+":"")+(Math.round(d*10)/10);}
    var dc=!changed?"var(--t3)":(f[2]&&parseFloat(delta)>0?"var(--g-a)":"var(--g-e)");
    return '<div style="padding:9px 16px;font-size:13px;color:var(--t2);border-top:1px solid var(--line)">'+f[1]+'</div>'
      +'<div class="num" style="padding:9px 6px;text-align:right;font-size:13px;border-top:1px solid var(--line)">'+va+f[3]+'</div>'
      +'<div class="num" style="padding:9px 6px;text-align:right;font-size:13px;font-weight:'+(changed?700:400)+';border-top:1px solid var(--line)">'+vb+f[3]+'</div>'
      +'<div class="num" style="padding:9px 16px 9px 6px;text-align:right;font-size:12px;color:'+dc+';border-top:1px solid var(--line)">'+delta+'</div>';
  }).join("");
  var idA=showId(snapEffectiveId(a)),idB=showId(snapEffectiveId(b));
  return '<div class="card" style="padding:0;overflow:hidden">'
    +'<div style="display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)"><span class="t" style="flex:1">Compare A · B</span>'
    +'<button class="btn btn-ghost" style="width:auto;padding:5px 10px;font-size:12px" onclick="clearCompare()">Clear</button></div>'
    +'<div style="display:grid;grid-template-columns:1.1fr 1fr 1fr .8fr;align-items:center">'
    +'<div class="eb" style="padding:10px 16px">FIELD</div>'
    +'<div style="padding:10px 6px;text-align:right;color:'+ca+';font-weight:700;font-size:13px">A '+idA+'</div>'
    +'<div style="padding:10px 6px;text-align:right;color:'+cb+';font-weight:700;font-size:13px">B '+idB+'</div>'
    +'<div class="eb" style="padding:10px 16px 10px 6px;text-align:right">Δ</div>'+rows+'</div></div>';
}

var emptyBattery='<div class="card empty">'+svg("battery",34)+'<div class="et">No battery loaded</div><div class="hint" style="margin-top:6px">Scan a battery to see its health report.</div>'
  +'<button class="btn btn-primary" style="margin-top:18px" onclick="showTab(\'scan\')">'+svg("scan",20)+' Go to Scan</button></div>';

/* ── actions ── */
function showTab(t){state.tab=t;state.sub=null;if(t==="battery"&&!state.current&&state.recent.length)openId(effId(state.recent[state.recent.length-1]),true);render();}
function drill(s){state.sub=s;render();}
function back(){state.sub=null;render();}
function openId(id,noTab){var rec=null;for(var i=state.recent.length-1;i>=0;i--)if(String(effId(state.recent[i]))===String(id)){rec=state.recent[i];break;}
  if(rec){
    state.current=rec;
    // Attach fleet context from cached /fleet data if record came from history (no fleet field)
    if(!state.current.fleet&&state.fleetRaw&&state.fleetRaw.n>=2){
      var f=state.fleetRaw,isR45=state.current.rated>=560;
      var ms=(isR45&&f.r45&&f.r45.n>=2)?f.r45:(!isR45&&f.r37&&f.r37.n>=2)?f.r37:(f.all||null);
      if(ms&&ms.n>=2) state.current.fleet=buildFleetContext(state.current,ms,f.n);
    }
  }
  if(!noTab){state.tab="battery";state.sub=null;}render();}

function scanNow(){state.scanning=true;render();
  getJSON("/scan").then(function(j){state.scanning=false;
    if(j&&j.eeprom_found===false){toast("No EEPROM found at 0x50");render();return;}
    state.current=normalize(j);if(typeof j.auto_save!=="undefined")state.autoSave=!!j.auto_save;
    state.tab="battery";state.sub=null;
    return refreshHistory().then(refreshSnaps).then(refreshFleet);
  }).then(render).catch(function(e){state.scanning=false;toast("Scan failed");render();});}

function saveSnap(){postForm("/save").then(function(j){if(j&&j.ok){toast("Snapshot saved · "+(j.timestamp||""));refreshSnaps().then(render);}else toast((j&&j.msg)||"Save failed");}).catch(function(){toast("Save failed");});}
function toggleAuto(v){state.autoSave=v;getJSON("/autosave?v="+(v?"1":"0")).catch(function(){});}
function analyzeDump(){var hex=$("dump").value||"";var n=hex.replace(/\s/g,"").length;
  postForm("/upload","dump="+encodeURIComponent(hex)).then(function(j){
    if(j&&(j.eeprom_found||j.battery_id)){state.current=normalize(j);state.tab="battery";state.sub=null;toast("Dump analyzed ("+Math.floor(n/2)+" B)");refreshHistory().then(render);}
    else toast((j&&j.msg)||"Upload failed");
  }).catch(function(){toast("Upload failed");});}
function clearDump(){var d=$("dump");if(d)d.value="";postForm("/cleardump").catch(function(){});toast("Cleared — next scan uses live I²C");}
function storeDump(slot){postForm("/storedump","slot="+slot).then(function(j){
  if(j&&j.ok){state.slots[slot]=state.current?showId(effId(state.current)):"?";toast("Stored as "+slot);
    var si=$("slotinfo");if(si)si.textContent="A: "+(state.slots.A||"—")+"   B: "+(state.slots.B||"—");
    if(state.slots.A&&state.slots.B)refreshCompare();}
  else toast((j&&j.msg)||"Store failed");
}).catch(function(){toast("Store failed");});}
function refreshCompare(){return getJSON("/compare").then(function(j){if(j&&j.ok){state.cmp={a:j.a,b:j.b};if(state.tab==="history")render();}}).catch(function(){});}
function clearCompare(){state.cmp=null;render();}

/* ── recode after cell replacement ── */
// nominal pack voltage for Wh calc — 9S confirmed topology, 3.65V/cell nominal
var PACK_NOMINAL_V = 32.85;
// pack topology is always 9S4P — parallel count is fixed, never a per-pack variable
var PACK_PARALLEL = 4;
// known confirmed tiers: raw 0x24 code -> {name, officialWh}
var KNOWN_TIERS = [
  {code:500, name:"R37", wh:374},
  {code:600, name:"R45", wh:447}
  // R50 (~499.5Wh) has no confirmed raw code yet — do not include as a writable target,
  // but if it's numerically closest, surface that in the display as informational-only.
];
function computeTier(mah){
  if(!mah) return null;
  var ah = (mah * PACK_PARALLEL) / 1000;
  var wh = ah * PACK_NOMINAL_V;
  var best=null, bestDist=Infinity;
  KNOWN_TIERS.forEach(function(t){var d=Math.abs(t.wh-wh); if(d<bestDist){bestDist=d;best=t;}});
  // also check whether R50 (~499.5Wh, no code) is actually closer, just for display
  var r50Dist = Math.abs(499.5 - wh);
  return {ah:ah, wh:wh, best:best, bestDist:bestDist, r50Closer: r50Dist < bestDist};
}
// Returns the retier target {code,name} to send, or null if no retier applies
// (blank input, or computed tier already matches the pack's current rated_capacity).
function recodeRetierTarget(){
  var mah=parseFloat($("recodeCellMah")?$("recodeCellMah").value:"");
  var t=computeTier(mah);
  if(!t||!t.best) return null;
  var curRated=state.current?state.current.rated:null;
  if(curRated!==null && curRated!==undefined && Number(curRated)===t.best.code) return null;
  return t.best;
}
function updateRecodeTierCalc(){
  var out=$("recodeTierCalc");if(!out)return;
  var mah=parseFloat($("recodeCellMah")?$("recodeCellMah").value:"");
  var t=computeTier(mah);
  if(!t){out.textContent="";return;}
  var txt="Pack: "+t.ah.toFixed(2)+"Ah / "+t.wh.toFixed(0)+"Wh @ "+PACK_NOMINAL_V+"V nominal. ";
  txt+="R37 (500/374Wh) Δ"+Math.abs(374-t.wh).toFixed(0)+"Wh, R45 (600/447Wh) Δ"+Math.abs(447-t.wh).toFixed(0)+"Wh.";
  if(t.r50Closer){
    txt+=" Closest by Wh is R50 (~499.5Wh) but no confirmed EEPROM code — cannot auto-write; falling back to nearest confirmed tier "+t.best.name+" ("+t.best.code+").";
  }
  var curRated=state.current?state.current.rated:null;
  if(curRated!==null && curRated!==undefined && Number(curRated)===t.best.code){
    txt+=" Already correct tier ("+t.best.name+"/"+t.best.code+").";
  } else {
    txt+=" Closest tier: "+t.best.name+" ("+t.best.code+") — will update 0x24 from "+(curRated!==null&&curRated!==undefined?curRated:"?")+" to "+t.best.code+".";
  }
  out.textContent=txt;
}
// Stored identifier for the currently-scanned battery — same rule the
// firmware applies server-side (effectiveId()).
function currentEffectiveId(){return effId(state.current);}
// The operator types the ID as displayed (no pad); map it back to the stored
// ID the firmware checks, or null on mismatch.
function confirmedId(typed){var id=currentEffectiveId();return id&&(typed===id||typed===showId(id))?id:null;}
function doRecodeClick(){
  var typed=($("recodeId").value||"").trim();
  var currentId=confirmedId(typed);
  if(!typed){toast("Type the serial number (or battery ID) to confirm");return;}
  if(!currentId){toast("ID does not match the currently scanned battery");return;}
  var retier=recodeRetierTarget();
  var msg="This will PERMANENTLY overwrite this pack's EEPROM:\n\n"
    +"• Stored capacity (0x1C) -> 100% of rated\n"
    +"• Charge events (0x10) -> 0\n"
    +"• Session counter (0x50) -> 0";
  if(retier) msg+="\n• Model tier (0x24) -> "+retier.code+" ("+retier.name+")";
  msg+="\n\nContinue?";
  if(!confirm(msg))return;
  var note=($("recodeNote")?$("recodeNote").value:"")||"";
  var ri=$("recoderesult");if(ri)ri.textContent="Writing…";
  var body="confirm=1&id="+encodeURIComponent(currentId)+"&note="+encodeURIComponent(note);
  if(retier) body+="&retier_code="+retier.code;
  postForm("/recode",body).then(function(j){
    if(!j){if(ri)ri.textContent="Recode failed — no response";toast("Recode failed");return;}
    var lines=(j.fields||[]).map(function(f){return f.name+" ("+f.addr+") -> "+f.target+" : "+(f.verified?"verified":"NOT verified");});
    if(ri)ri.textContent=(j.ok?"OK — ":"FAILED — ")+(j.msg||"")+(lines.length?"\n"+lines.join("\n"):"");
    toast(j.ok?"Recode complete":"Recode failed — "+(j.msg||""));
    if(j.ok){refreshHistory().then(refreshSnaps).then(refreshFleet).then(function(){
      return getJSON("/data").then(function(d){if(d&&d.eeprom_found)state.current=normalize(d);});
    }).then(render);}
  }).catch(function(){if(ri)ri.textContent="Recode request failed";toast("Recode request failed");});
}
function loadRecodeBackups(){
  var box=$("recodebackuplist");
  if(box)box.textContent="Loading…";
  getJSON("/recodebackups").then(function(arr){
    state.recodeBackups=arr||[];
    renderRecodeBackups();
  }).catch(function(){
    if(box)box.textContent="Failed to load backups";
    toast("Failed to load backups");
  });
}
function renderRecodeBackups(){
  var box=$("recodebackuplist");
  if(!box)return;
  var arr=state.recodeBackups||[];
  if(!arr.length){box.innerHTML='<div class="hint">No backups saved yet.</div>';return;}
  box.innerHTML=arr.map(function(b,i){
    var noteTxt=b.note?(' — '+b.note):'';
    return '<div class="card" style="margin-top:6px;padding:10px 12px">'
      +'<div style="font-size:13px"><b>'+(b.timestamp||'?')+'</b> · '+(showId(snapEffectiveId(b))||'?')+' · '+(b.identity_field||'?')+noteTxt+'</div>'
      +'<div class="hint" style="margin-top:2px">'+(b.reason||'')+'</div>'
      +'<button class="btn btn-ghost" style="margin-top:6px;width:auto;padding:8px 14px" onclick="doRestoreClick('+i+')">Restore this</button>'
      +'</div>';
  }).join("");
}
function doRestoreClick(i){
  var b=(state.recodeBackups||[])[i];
  if(!b){toast("Backup not found — reload the list");return;}
  var typed=($("recodeId").value||"").trim();
  var currentId=confirmedId(typed);
  if(!typed){toast("Type the serial number (or battery ID) to confirm");return;}
  if(!currentId){toast("ID does not match the currently scanned battery");return;}
  var msg="This will overwrite the ENTIRE 256-byte EEPROM with the backup from "+(b.timestamp||'?')+".\n\nContinue?";
  if(!confirm(msg))return;
  var ri=$("restoreresult");if(ri)ri.textContent="Writing…";
  var body="confirm=1&id="+encodeURIComponent(currentId)+"&dump="+encodeURIComponent(b.raw_dump||"");
  postForm("/restore",body).then(function(j){
    if(!j){if(ri)ri.textContent="Restore failed — no response";toast("Restore failed");return;}
    if(ri)ri.textContent=(j.ok?"OK — ":"FAILED — ")+(j.msg||"")+" (backed_up: "+(j.backed_up?"yes":"no")+", verified: "+(j.verified?"yes":"no")+")";
    toast(j.ok?"Restore complete":"Restore failed — "+(j.msg||""));
    if(j.ok){refreshHistory().then(refreshSnaps).then(refreshFleet).then(function(){
      return getJSON("/data").then(function(d){if(d&&d.eeprom_found)state.current=normalize(d);});
    }).then(render);}
  }).catch(function(){if(ri)ri.textContent="Restore request failed";toast("Restore request failed");});
}

/* ── loaders ── */
function refreshHistory(){return getJSON("/history").then(function(arr){state.recent=(arr||[]).map(normalize);}).catch(function(){state.recent=[];});}
function refreshSnaps(){return getJSON("/snapshots").then(function(arr){state.snaps=arr||[];}).catch(function(){state.snaps=[];});}
function refreshFleet(){return getJSON("/fleet").then(function(j){
  state.fleetRaw=j||null;
  // Re-attach fleet context to current battery if it was loaded from history (no fleet field)
  if(state.current&&!state.current.fleet&&j&&j.n>=2){
    var isR45=state.current.rated>=560;
    var ms=(isR45&&j.r45&&j.r45.n>=2)?j.r45:(!isR45&&j.r37&&j.r37.n>=2)?j.r37:(j.all||null);
    if(ms&&ms.n>=2) state.current.fleet=buildFleetContext(state.current,ms,j.n);
  }
}).catch(function(){state.fleetRaw=null;});}
function buildFleetContext(b,ms,totalN){
  function fd(v,mn,mx,mean){
    var pct=(mx===mn)?50:Math.max(0,Math.min(100,(v-mn)/(mx-mn)*100));
    return {v:v,min:mn,max:mx,mean:mean,pct:Math.round(pct)};
  }
  return {
    n:totalN,
    cap_pct:       b.storedValid ? fd(b.pct, ms.cap_pct.min, ms.cap_pct.max, ms.cap_pct.mean) : null,
    cal_cycles:    fd(b.calCycles,   ms.cal_cycles.min,    ms.cal_cycles.max,    ms.cal_cycles.mean),
    charge_events: fd(b.chargeEvents,ms.charge_events.min, ms.charge_events.max, ms.charge_events.mean),
    top_spread:    fd(b.topSpread,   ms.top_spread.min,    ms.top_spread.max,    ms.top_spread.mean),
    bot_spread:    fd(b.botSpread,   ms.bot_spread.min,    ms.bot_spread.max,    ms.bot_spread.mean)
  };
}
function loadInitial(){
  return getJSON("/data").then(function(j){if(j&&j.eeprom_found){state.current=normalize(j);if(typeof j.auto_save!=="undefined")state.autoSave=!!j.auto_save;}}).catch(function(){})
    .then(refreshHistory).then(refreshSnaps).then(refreshFleet);
}

/* ── boot ── */
__dev.onConnect(function(){__dev.request("GET","/settime?ts="+Math.floor(Date.now()/1000)).catch(function(){});loadInitial().then(render);});
render();
loadInitial().then(render);
window.showTab=showTab;window.drill=drill;window.back=back;window.openId=openId;window.scanNow=scanNow;
window.saveSnap=saveSnap;window.toggleAuto=toggleAuto;window.analyzeDump=analyzeDump;
window.clearDump=clearDump;window.storeDump=storeDump;window.clearCompare=clearCompare;
window.doRecodeClick=doRecodeClick;window.updateRecodeTierCalc=updateRecodeTierCalc;
window.loadRecodeBackups=loadRecodeBackups;window.doRestoreClick=doRestoreClick;
window.mapJump=mapJump;window.startLive=startLive;window.stopLive=stopLive;window.clearLive=clearLive;window.setLiveInterval=setLiveInterval;
</script>
